<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ピロ｜楽天アフィリ自動化ツール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;600;700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f7cff;
    --accent2: #7c5cfc;
    --gold: #f5a623;
    --green: #2ecc71;
    --red: #e74c3c;
    --text: #e8eaf6;
    --muted: #7b82a8;
    --font: 'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
  }

  /* ヘッダー */
  header {
    background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-mark {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  header p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* メインレイアウト */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* カード */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::before {
    content: '';
    display: block;
    width: 3px; height: 14px;
    background: linear-gradient(var(--accent), var(--accent2));
    border-radius: 2px;
  }

  /* API設定グリッド */
  .api-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 600px) {
    .api-grid { grid-template-columns: 1fr; }
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type="text"], input[type="password"], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    transition: border-color 0.2s;
    outline: none;
  }
  input[type="text"]:focus,
  input[type="password"]:focus,
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,124,255,0.12);
  }

  /* キーワード入力 */
  .search-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .search-row .field { flex: 1; }

  /* ボタン */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 16px rgba(79,124,255,0.3);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(79,124,255,0.4);
  }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--border); }

  /* ステータスバー */
  .status-bar {
    display: none;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    color: var(--muted);
    align-items: center;
    gap: 10px;
  }
  .status-bar.active { display: flex; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 進捗ステップ */
  .progress-steps {
    display: none;
    gap: 8px;
    flex-wrap: wrap;
  }
  .progress-steps.active { display: flex; }
  .step-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    transition: all 0.3s;
  }
  .step-pill.done {
    background: rgba(46,204,113,0.1);
    border-color: rgba(46,204,113,0.3);
    color: var(--green);
  }
  .step-pill.active {
    background: rgba(79,124,255,0.1);
    border-color: rgba(79,124,255,0.3);
    color: var(--accent);
  }

  /* 商品カード一覧 */
  .products-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .product-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .product-thumb {
    width: 64px; height: 64px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
  }
  .product-info { flex: 1; min-width: 0; }
  .product-name {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 6px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .product-meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--muted);
  }
  .product-price { color: var(--gold); font-weight: 700; }
  .product-review { color: var(--green); }

  /* 投稿文エリア */
  .post-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .post-header {
    background: var(--surface);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .post-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .post-product-name {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 300px;
  }

  /* 3スライド */
  .slides-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 640px) {
    .slides-grid { grid-template-columns: 1fr; }
  }
  .slide {
    background: var(--surface2);
    padding: 14px;
  }
  .slide-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .slide-text {
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .copy-row {
    padding: 10px 14px;
    display: flex;
    gap: 6px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .btn-copy {
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: var(--font);
    transition: all 0.2s;
  }
  .btn-copy:hover { color: var(--text); background: var(--border); }
  .btn-copy.copied { color: var(--green); border-color: rgba(46,204,113,0.4); }

  /* GAS保存状態 */
  .gas-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .gas-status.ok {
    background: rgba(46,204,113,0.1);
    color: var(--green);
    border: 1px solid rgba(46,204,113,0.3);
  }
  .gas-status.err {
    background: rgba(231,76,60,0.1);
    color: var(--red);
    border: 1px solid rgba(231,76,60,0.3);
  }

  /* 結果エリア */
  #results { display: none; }
  #results.active { display: block; }

  /* エラー */
  .error-box {
    background: rgba(231,76,60,0.1);
    border: 1px solid rgba(231,76,60,0.3);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--red);
    display: none;
  }
  .error-box.active { display: block; }

  /* GAS設定 */
  .gas-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .gas-row .field { flex: 1; }

  /* トグル */
  .toggle-section {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    margin-top: 12px;
  }
  .toggle-section:hover { color: var(--text); }
  .toggle-body { display: none; margin-top: 14px; }
  .toggle-body.open { display: block; }
</style>
</head>
<body>

<header>
  <div class="logo-mark">🕺</div>
  <div>
    <h1>ピロ｜楽天アフィリ自動化ツール</h1>
    <p>キーワード入力 → 商品取得 → 3スライド投稿文生成 → スプレッドシート保存</p>
  </div>
</header>

<div class="container">

  <!-- API設定カード -->
  <div class="card">
    <div class="card-title">API設定</div>
    <div class="api-grid">
      <div>
        <label>楽天アプリケーションID</label>
        <input type="password" id="rakutenAppId" placeholder="xxxxxxxxxxxxxxxxxx">
      </div>
      <div>
        <label>楽天アフィリエイトID</label>
        <input type="password" id="rakutenAffId" placeholder="xxxxxxxx.xxxxxxxx.xxxxxxxx.xxxxxxxx">
      </div>
      <div>
        <label>Anthropic APIキー</label>
        <input type="password" id="anthropicKey" placeholder="sk-ant-api03-...">
      </div>
      <div>
        <label>GAS Webhook URL</label>
        <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/xxx/exec">
      </div>
    </div>
    <div class="toggle-section" onclick="toggleAdv()">
      ▶ 詳細設定
    </div>
    <div class="toggle-body" id="advBody">
      <div style="margin-top:4px;">
        <label>スプレッドシートID（GASに埋め込み済みなら不要）</label>
        <input type="text" id="ssId" placeholder="1AlJjJqyH2Hau_ofrOeMguw5pYfnHsOGKJSFyOpSA-Og">
      </div>
    </div>
  </div>

  <!-- 検索カード -->
  <div class="card">
    <div class="card-title">商品キーワード</div>
    <div class="search-row">
      <div class="field">
        <label>キーワード（例：テストステロン サプリ、睡眠 サプリ、LOH症候群 対策）</label>
        <input type="text" id="keyword" placeholder="テストステロン サプリ" value="テストステロン サプリ">
      </div>
      <button class="btn btn-primary" onclick="runAll()" id="runBtn">
        ⚡ 生成スタート
      </button>
    </div>
  </div>

  <!-- 進捗 -->
  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <span id="statusText">処理中...</span>
  </div>
  <div class="progress-steps" id="progressSteps">
    <div class="step-pill" id="step1">① 楽天商品検索</div>
    <div class="step-pill" id="step2">② Claude投稿文生成</div>
    <div class="step-pill" id="step3">③ スプレッドシート保存</div>
  </div>

  <!-- エラー -->
  <div class="error-box" id="errorBox"></div>

  <!-- 結果 -->
  <div id="results">
    <!-- 商品一覧 -->
    <div class="card" style="margin-bottom:24px;">
      <div class="card-title">取得商品（上位5件）</div>
      <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- 投稿文 -->
    <div class="card">
      <div class="card-title">ピロ 3スライド投稿文</div>
      <div id="postsContainer"></div>
    </div>
  </div>

</div>

<script>
// ── ユーティリティ ──────────────────────────

function setStep(n, state) {
  const el = document.getElementById('step' + n);
  if (!el) return;
  el.className = 'step-pill ' + state;
  if (state === 'done') el.textContent = '✓ ' + el.textContent.replace(/^[✓①②③] ?/, '');
  if (state === 'active') el.textContent = el.textContent.replace(/^[✓①②③] ?/, '');
}

function setStatus(msg) {
  document.getElementById('statusText').textContent = msg;
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = '⚠ ' + msg;
  el.classList.add('active');
}

function clearError() {
  const el = document.getElementById('errorBox');
  el.textContent = '';
  el.classList.remove('active');
}

function toggleAdv() {
  const body = document.getElementById('advBody');
  const btn = document.querySelector('.toggle-section');
  const open = body.classList.toggle('open');
  btn.textContent = (open ? '▼' : '▶') + ' 詳細設定';
}

// ── 楽天API ──────────────────────────────────

async function searchRakuten(keyword, appId, affId) {
  const url = `https://app.rakuten.co.jp/services/api/IchibaItem/Search/20170706?` +
    `applicationId=${encodeURIComponent(appId)}&` +
    `affiliateId=${encodeURIComponent(affId)}&` +
    `keyword=${encodeURIComponent(keyword)}&` +
    `hits=5&` +
    `sort=-reviewCount&` +
    `imageFlag=1&` +
    `formatVersion=2`;

  const res = await fetch(url);
  if (!res.ok) throw new Error(`楽天API エラー: ${res.status}`);
  const data = await res.json();
  if (data.error) throw new Error(`楽天API: ${data.error_description || data.error}`);

  return (data.Items || []).map(item => ({
    name: item.itemName,
    price: item.itemPrice,
    url: item.itemUrl,
    affiliateUrl: item.affiliateUrl,
    imageUrl: (item.mediumImageUrls && item.mediumImageUrls[0]) ? item.mediumImageUrls[0] : '',
    reviewAverage: item.reviewAverage,
    reviewCount: item.reviewCount,
    shopName: item.shopName,
    catchCopy: item.catchcopy || '',
  }));
}

// ── Claude API ───────────────────────────────

const PIRO_SYSTEM = `あなたは「ピロ｜誰も語らないアラカン男性のからだ」というThreadsアカウントのライターです。

ペルソナ：アラカン（60歳前後）男性。男性更年期・LOH症候群・テストステロン低下・睡眠・体力回復などをテーマに発信。楽天ROOMでグッズを紹介中。

3スライド必殺構造：
S1（フックスライド）：
「〇〇でしょ」逆説フックで始める。更年期の老体にはピンチでしょ！🕺 を末尾に必ず入れる。
S2（本題スライド）：
「〇〇学でわかっていることがある」という導入→えっポイント（驚きの知見）→「今日やること（すぐにでもやって！🕺）」で締める。
S3（CTAスライド）：
「知れば、手は打てる。」で始める→楽天アフィリリンクを直貼り→「お隣の方にも見せてあげてください🕺」で締める。

ルール：
- 薬機法に抵触する断定表現（「治る」「治療」「効果が確実」等）は使わない
- 「サポート」「サポートが期待できる」「含まれる」「注目されている」程度の表現を使う
- アラカン男性の実体験・共感ベースのトーンで
- 絵文字は🕺を多用（ピロのシグネチャ）
- ハッシュタグは入れない
- PR表記は S1の冒頭に【PR】を入れる

出力形式：必ずJSON形式のみで返す。前置き・説明は一切不要。
{
  "s1": "スライド1本文",
  "s2": "スライド2本文",
  "s3": "スライド3本文"
}`;

async function generatePost(product, apiKey) {
  const userPrompt = `以下の楽天商品について、ピロの3スライド投稿文を生成してください。

商品名：${product.name}
価格：${product.price.toLocaleString()}円
レビュー評価：★${product.reviewAverage}（${product.reviewCount}件）
キャッチコピー：${product.catchCopy}
アフィリリンク：${product.affiliateUrl || product.url}`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: PIRO_SYSTEM,
      messages: [{ role: 'user', content: userPrompt }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(`Claude API エラー: ${err.error?.message || res.status}`);
  }

  const data = await res.json();
  const raw = data.content?.[0]?.text || '{}';
  const clean = raw.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

// ── GAS保存 ──────────────────────────────────

async function saveToGAS(gasUrl, rows) {
  const payload = { type: 'piro_affiliate', rows };
  const res = await fetch(gasUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    mode: 'no-cors'
  });
  // no-corsではレスポンスが読めないが送信はできる
  return true;
}

// ── UI描画 ──────────────────────────────────

function renderProducts(items) {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = items.map(item => `
    <div class="product-card">
      ${item.imageUrl ? `<img class="product-thumb" src="${item.imageUrl}" alt="">` : '<div class="product-thumb"></div>'}
      <div class="product-info">
        <div class="product-name">${item.name}</div>
        <div class="product-meta">
          <span class="product-price">¥${item.price.toLocaleString()}</span>
          <span class="product-review">★${item.reviewAverage}（${item.reviewCount}件）</span>
          <span>${item.shopName}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function renderPost(index, product, slides, gasOk) {
  const container = document.getElementById('postsContainer');
  const block = document.createElement('div');
  block.className = 'post-block';

  const gasBadge = gasOk
    ? `<span class="gas-status ok">✓ SS保存済</span>`
    : `<span class="gas-status err">SS保存失敗</span>`;

  block.innerHTML = `
    <div class="post-header">
      <div>
        <span class="post-num">投稿 ${index + 1}</span>
        <span style="color:var(--muted);font-size:11px;margin-left:8px;">${product.name.substring(0,30)}...</span>
      </div>
      ${gasBadge}
    </div>
    <div class="slides-grid">
      <div class="slide">
        <div class="slide-label">S1｜フック</div>
        <div class="slide-text" id="s1_${index}">${slides.s1}</div>
      </div>
      <div class="slide">
        <div class="slide-label">S2｜本題</div>
        <div class="slide-text" id="s2_${index}">${slides.s2}</div>
      </div>
      <div class="slide">
        <div class="slide-label">S3｜CTA</div>
        <div class="slide-text" id="s3_${index}">${slides.s3}</div>
      </div>
    </div>
    <div class="copy-row">
      <button class="btn-copy" onclick="copySlide('s1_${index}', this)">S1コピー</button>
      <button class="btn-copy" onclick="copySlide('s2_${index}', this)">S2コピー</button>
      <button class="btn-copy" onclick="copySlide('s3_${index}', this)">S3コピー</button>
      <button class="btn-copy" onclick="copyAll(${index}, this)">全スライドコピー</button>
      <a href="${product.affiliateUrl || product.url}" target="_blank" style="font-size:11px;color:var(--accent);text-decoration:none;padding:6px 0;margin-left:4px;">商品ページ →</a>
    </div>
  `;
  container.appendChild(block);
}

function copySlide(id, btn) {
  const text = document.getElementById(id)?.textContent || '';
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ コピー済';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = btn.textContent.replace('✓ コピー済', id.startsWith('s1') ? 'S1コピー' : id.startsWith('s2') ? 'S2コピー' : 'S3コピー');
    }, 1500);
  });
}

function copyAll(index, btn) {
  const s1 = document.getElementById('s1_' + index)?.textContent || '';
  const s2 = document.getElementById('s2_' + index)?.textContent || '';
  const s3 = document.getElementById('s3_' + index)?.textContent || '';
  const all = `【S1】\n${s1}\n\n【S2】\n${s2}\n\n【S3】\n${s3}`;
  navigator.clipboard.writeText(all).then(() => {
    btn.textContent = '✓ コピー済';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '全スライドコピー';
    }, 1500);
  });
}

// ── メイン実行 ───────────────────────────────

async function runAll() {
  clearError();

  const appId    = document.getElementById('rakutenAppId').value.trim();
  const affId    = document.getElementById('rakutenAffId').value.trim();
  const apiKey   = document.getElementById('anthropicKey').value.trim();
  const gasUrl   = document.getElementById('gasUrl').value.trim();
  const keyword  = document.getElementById('keyword').value.trim();

  if (!appId || !affId || !apiKey || !keyword) {
    showError('楽天アプリID・アフィリエイトID・AnthropicAPIキー・キーワードは必須です');
    return;
  }

  // UIリセット
  document.getElementById('runBtn').disabled = true;
  document.getElementById('results').classList.remove('active');
  document.getElementById('productsGrid').innerHTML = '';
  document.getElementById('postsContainer').innerHTML = '';
  document.getElementById('statusBar').classList.add('active');
  document.getElementById('progressSteps').classList.add('active');
  ['step1','step2','step3'].forEach(id => {
    const el = document.getElementById(id);
    el.className = 'step-pill';
    el.textContent = el.textContent.replace(/^[✓] ?/, '');
  });

  let products = [];

  try {
    // STEP 1: 楽天商品検索
    setStep(1, 'active');
    setStatus('楽天市場から商品を検索中...');
    products = await searchRakuten(keyword, appId, affId);
    if (!products.length) throw new Error('商品が見つかりませんでした。キーワードを変えてみてください。');
    renderProducts(products);
    document.getElementById('results').classList.add('active');
    setStep(1, 'done');

    // STEP 2: 投稿文生成（逐次）
    setStep(2, 'active');
    for (let i = 0; i < products.length; i++) {
      setStatus(`投稿文を生成中... (${i + 1}/${products.length})`);
      let slides, gasOk = false;
      try {
        slides = await generatePost(products[i], apiKey);
      } catch (e) {
        slides = { s1: '生成エラー: ' + e.message, s2: '', s3: '' };
      }

      // STEP 3: GAS保存（各商品ごと）
      if (gasUrl) {
        try {
          const row = {
            keyword,
            productName: products[i].name,
            price: products[i].price,
            reviewAverage: products[i].reviewAverage,
            reviewCount: products[i].reviewCount,
            affiliateUrl: products[i].affiliateUrl || products[i].url,
            s1: slides.s1,
            s2: slides.s2,
            s3: slides.s3,
            createdAt: new Date().toISOString(),
          };
          await saveToGAS(gasUrl, [row]);
          gasOk = true;
        } catch (e) {
          gasOk = false;
        }
      }

      renderPost(i, products[i], slides, gasOk);
    }
    setStep(2, 'done');
    setStep(3, 'done');
    setStatus(`完了！ ${products.length}商品の投稿文を生成しました 🕺`);

  } catch (e) {
    showError(e.message);
    setStatus('エラーが発生しました');
  } finally {
    document.getElementById('runBtn').disabled = false;
  }
}

// Enterキーでも実行
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('keyword').addEventListener('keydown', e => {
    if (e.key === 'Enter') runAll();
  });

  // スプレッドシートIDのデフォルト値
  document.getElementById('ssId').value = '1AlJjJqyH2Hau_ofrOeMguw5pYfnHsOGKJSFyOpSA-Og';
});
</script>
